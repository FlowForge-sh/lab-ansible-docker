[defaults]
inventory = inventories/aws/hosts.yml
roles_path = roles
collections_path = collections
# Brez Python opozoril na vsakem hostu.
interpreter_python = auto_silent
# Berljiv izpis napak in rezultatov.
callback_result_format = yaml
# Hitreje: facts se zberejo enkrat in se hranijo 10 min.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .facts
fact_caching_timeout = 600
forks = 10

[ssh_connection]
# Prvič sprejmi nov host ključ, kasneje ga preverjaj (TOFU).
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
pipelining = true
