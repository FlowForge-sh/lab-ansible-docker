---
# AWS inventory: vsak udeleženec ima
# EN strežnik, ki je hkrati Ansible control in Docker host. Ansible teče na
# tem strežniku in cilja sam sebe: ansible_connection: local (brez SSH).
# Host "control" je v vseh skupinah; z več strežniki bi bil vsak v svojih
# skupinah, playbooki in role pa bi ostali enaki.
# To je privzeti inventory (ansible.cfg); izrecno: ansible-playbook -i inventories/aws/hosts.yml ...
all:
  vars:
    ansible_user: lab
  hosts:
    control:
      ansible_connection: local
      # Sistemski Python: tam sta python3-docker in python3-debian, ki ju
      # namesti rola docker z apt (venv ~/.venv ju nima).
      ansible_python_interpreter: /usr/bin/python3
  children:
    docker_hosts:
      hosts:
        control:
    app_hosts:
      hosts:
        control:
    monitoring:
      hosts:
        control:
