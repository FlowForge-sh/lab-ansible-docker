---
# AWS lab: en strežnik "control". Za to vajo gre Ansible nanj prek pravega
# SSH (127.0.0.1), kot na oddaljen host.
all:
  vars:
    ansible_user: lab
    ansible_python_interpreter: /usr/bin/python3
  hosts:
    control:
      ansible_connection: ssh
      ansible_host: 127.0.0.1
      ansible_user: root
  children:
    docker_hosts:
      hosts:
        control:
    app_hosts:
      hosts:
        control:
