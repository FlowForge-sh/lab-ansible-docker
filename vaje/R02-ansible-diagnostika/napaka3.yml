---
# Napaka 3: pregled kontejnerjev na hostih z aplikacijami.
- name: Kontejnerji na app hostih
  hosts: app_hosts
  become: true
  tasks:
    - name: Seznam kontejnerjev
      community.docker.docker_host_infos:
        containers: true
      register: docker_host

    - name: Izpis
      ansible.builtin.debug:
        msg: "{{ docker_host.containers | map(attribute='Names') | flatten | list }}"
